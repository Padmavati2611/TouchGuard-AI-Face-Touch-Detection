[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchguard-ai"
version = "2.0.0"
description = "TouchGuard AI - Real-Time Face-Touch Detection & Voice Warning System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TouchGuard AI Team" },
]
keywords = ["computer-vision", "opencv", "mediapipe", "face-touch", "health"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "opencv-contrib-python>=4.8.0,<4.11.0",
    "numpy>=1.24.0,<2.0.0",
    "mediapipe>=0.10.14",
    "protobuf>=4.25.3,<5.0.0",
    "pyttsx3>=2.90",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-mock>=3.11.0"]

[tool.setuptools]
packages = ["touchguard"]